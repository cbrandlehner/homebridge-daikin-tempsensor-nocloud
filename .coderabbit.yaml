# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
# Unset keys still come from the CodeRabbit organization UI.
inheritance: true
reviews:
  profile: chill
  high_level_summary: true
  poem: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/**/*.js"
      instructions: |
        This plugin only reads a local Daikin temperature sensor. Do not suggest control writes or the Daikin cloud API. Older adapters use plain HTTP.
        Never set a TLS server name, or a Host header that Superagent copies into the server name, to an IP address. Node 26 rejects that. A hostname may still be used as the server name.
        Do not log adapter UUIDs or credentials.
        Temperature reads must surface request errors to the caller instead of dropping the callback.
    - path: "test/**/*.js"
      instructions: |
        Tests use node:test and must not require a live Daikin device. Assert behavior, including request failures and invalid temperature values.
chat:
  auto_reply: true
